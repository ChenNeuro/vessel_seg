[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-seg"
version = "0.1.0"
description = "Coronary vessel segmentation and quantitative analysis workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yihao Chen" }
]

[project.scripts]
vessel-seg = "vessel_seg.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vessel_seg*"]

[tool.setuptools.package-data]
vessel_seg = ["metadata_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
